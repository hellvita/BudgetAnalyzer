services:
  postgres:
    image: postgres:16
    container_name: budget-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - budget_pg_data:/var/lib/postgresql/data

volumes:
  budget_pg_data:
