name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Format check ─────────────────────────────────────────────────────────────
  # Runs in parallel with build — a format failure surfaces without waiting for build.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore BudgetAnalyzer.slnx

      - run: dotnet format BudgetAnalyzer.slnx --verify-no-changes

  # ── Build ────────────────────────────────────────────────────────────────────
  # Restores, builds, and uploads artifacts so test jobs can use --no-build.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore BudgetAnalyzer.slnx

      - run: dotnet build BudgetAnalyzer.slnx --no-restore --no-incremental

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/
            **/obj/

  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - run: >
          dotnet test tests/BudgetAnalyzer.UnitTests
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            **/unit-results.trx
            **/coverage.cobertura.xml

      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: "**/unit-results.trx"
          reporter: dotnet-trx

  # ── Integration tests ────────────────────────────────────────────────────────
  # Uses Testcontainers: the test suite spins up its own Postgres Docker container.
  # Docker is pre-installed on ubuntu-latest runners, no extra setup needed.
  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - run: >
          dotnet test tests/BudgetAnalyzer.IntegrationTests
          --no-build
          --logger "trx;LogFileName=integration-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: "**/integration-results.trx"

      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: "**/integration-results.trx"
          reporter: dotnet-trx
